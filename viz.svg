<text x="56.0" y="349.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">One more partition pins index 4 = 5. Expected O(n) total (n + n/2 + n/4...), O(n²)</text>
